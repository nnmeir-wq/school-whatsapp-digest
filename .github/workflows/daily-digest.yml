name: Daily School Digest

on:
  schedule:
    # 03:25 UTC = 06:25 Israel time (summer/DST).
    # In winter (UTC+2) this fires at 05:25 local instead - a one-hour
    # drift around the DST transitions, which is fine.
    #
    # NOTE: GitHub Actions "schedule" runs are best-effort and can be
    # delayed by hours during high load (confirmed - a run meant for
    # 04:00 UTC once fired at 09:07 UTC). This only leaves a ~35-minute
    # buffer before 07:00, so a repeat of that delay would miss it.
    - cron: '25 3 * * *'
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          GROUP_TO_CHILD_JSON: ${{ secrets.GROUP_TO_CHILD_JSON }}
