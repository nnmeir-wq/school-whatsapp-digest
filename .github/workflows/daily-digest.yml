name: Daily School Digest

on:
  schedule:
    # 23:07 Israel time, every night. The explicit timezone field (GitHub
    # Actions, since March 2026) handles the UTC conversion and DST
    # transitions automatically - no manual UTC math or duplicate cron
    # lines needed.
    #
    # NOTE: GitHub Actions "schedule" runs are best-effort and can be
    # delayed significantly during high load - confirmed in practice:
    # every scheduled run over the last two weeks fired 5-7+ hours late
    # (and the delay has been trending upward, not just occasional). At
    # 23:07 that leaves under 7 hours of buffer before 06:00, which may
    # not be enough on a bad day. If the digest keeps arriving after
    # 06:00, the only fully reliable fix is moving off GitHub Actions
    # scheduling entirely (see the local-cron alternative in the README).
    - cron: '7 23 * * *'
      timezone: 'Asia/Jerusalem'
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          GROUP_TO_CHILD_JSON: ${{ secrets.GROUP_TO_CHILD_JSON }}
